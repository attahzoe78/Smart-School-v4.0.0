name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Push database schema
        run: bun run db:push
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Build Next.js app
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Build Windows installer with electron-builder
        run: bun run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartSchool-Windows-Setup
          path: dist/SmartSchool-Setup-*.exe
          if-no-files-found: warn

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SmartSchool-Setup-*.exe
          name: Smart School ${{ github.ref_name }}
          body: |
            # Smart School ${{ github.ref_name }}

            ## Installation

            1. Download `SmartSchool-Setup-${{ github.ref_name }}.exe`
            2. Run the installer
            3. Follow the setup wizard
            4. Launch Smart School from your desktop

            ## System Requirements

            - Windows 10 or later (64-bit)
            - 2GB RAM minimum
            - 500MB free disk space

            ## Features

            - 25+ school management modules
            - 8 user panels (Super Admin, Admin, Teacher, Student, etc.)
            - Nigerian market localization
            - Offline SQLite database (no internet required)
            - Web-based installation wizard

            ---
            Developed by Sisi Technology Ltd, Jos Plateau State, Nigeria
          draft: false
          prerelease: false
